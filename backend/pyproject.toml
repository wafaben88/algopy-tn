[project]
name = "algopy-backend"
version = "0.1.0"
description = "Backend API for AlgoPy TN — Tunisian high-school algorithms & Python learning platform"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-migrate>=4.0.7",
    "flask-jwt-extended>=4.6.0",
    "flask-cors>=5.0.0",
    "sqlalchemy>=2.0.36",
    "pydantic[email]>=2.9.2",
    "pydantic-settings>=2.6.1",
    "argon2-cffi>=23.1.0",
    "pillow>=11.0.0",
    "python-slugify>=8.0.4",
    "google-genai>=0.3.0",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.2.3",
    "click>=8.1.7",
]

[project.scripts]
algopy-backend = "algopy_backend.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algopy_backend"]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-flask>=1.3.0",
    "ruff>=0.7.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
# E501: line length handled by formatter
# B905: strict= on zip — not all callsites need it
# UP047: PEP 695 generic-function syntax not adopted yet
ignore = ["E501", "B905", "UP047"]

[tool.pytest.ini_options]
testpaths = ["tests"]
